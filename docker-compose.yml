version: "3.9"

services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

    depends_on:
      - backend

  mongodb:
    image: mongo
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: